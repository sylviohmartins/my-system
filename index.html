<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#401a33">
<meta name="description" content="ContaGi — organização de extratos, lançamentos, conciliação e relatórios contábeis no navegador.">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>ContaGi — Extratos e Lançamentos</title>
<script>
try {
  const stored = localStorage.getItem('contabil.local.pages.v1.theme');
  document.documentElement.dataset.theme = stored === 'light' || stored === 'dark'
    ? stored
    : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
} catch { document.documentElement.dataset.theme = 'light'; }
</script>
<link rel="stylesheet" href="./styles.css">
</head>
<body><div id="app"></div><script type="module" src="./app.js"></script></body>
</html>
