name: Publicar demonstração no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar sistema
        run: npm run verify
      - name: Preparar artefato sem arquivos privados
        run: |
          mkdir -p _site
          cp index.html styles.css admin-shell.css app.js core.js ui.mjs importers.mjs .nojekyll _site/
          mkdir -p _site/assets _site/vendor/pdfjs _site/vendor/xlsx _site/vendor/licenses
          cp assets/icons.svg _site/assets/
          cp vendor/pdfjs/pdf.mjs vendor/pdfjs/pdf.worker.mjs _site/vendor/pdfjs/
          cp vendor/xlsx/xlsx.full.min.js _site/vendor/xlsx/
          cp vendor/licenses/*.txt _site/vendor/licenses/
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
